id: io.github.noobping.keycord
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk

sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.llvm22

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin

command: keycord

finish-args:
  - --device=dri
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland

modules:
  - name: capnproto
    buildsystem: autotools
    subdir: c++
    no-autogen: true
    config-opts:
      - --disable-static

    sources:
      - type: git
        url: https://github.com/capnproto/capnproto.git
        tag: v1.5.0
        commit: 373e61ec89e2359f1c362e9b2eadc552f4779306
      - type: shell
        commands:
          - cd c++ && autoreconf -fi

  - name: pcsc-lite
    buildsystem: meson
    config-opts:
      - -Dlibsystemd=false
      - -Dpolkit=false
      - -Dipcdir=/run/pcscd

    sources:
      - type: git
        url: https://github.com/LudovicRousseau/PCSC.git
        tag: 2.5.2
        commit: 6cadd8152f3cfdb79131a65843d9b85f01f0ae51

  - name: libcbor
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_TESTING=OFF
    sources:
      - type: git
        url: https://github.com/PJK/libcbor.git
        tag: v0.14.0
        commit: 6730c20ab487c0b4dc5fb3fea918937085355bac

  - name: libfido2
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_EXAMPLES=OFF
      - -DBUILD_MANPAGES=OFF
      - -DBUILD_STATIC_LIBS=OFF
      - -DBUILD_TOOLS=OFF
      - -DNFC_LINUX=OFF
      - -DUSE_HIDAPI=ON
    sources:
      - type: git
        url: https://github.com/Yubico/libfido2.git
        tag: 1.17.0
        commit: b974e7cf2ee7392134cc12c08b76a068cf250dd8

  - name: git
    buildsystem: autotools
    make-args:
      - INSTALL_SYMLINKS=1
    make-install-args:
      - INSTALL_SYMLINKS=1

    sources:
      - type: archive
        url: https://cdn.kernel.org/pub/software/scm/git/git-2.56.0.tar.xz
        sha256: 26c56c296b38c0695b26fa95f475f1d01704d2d38e73465ca30b0b2f5dc789d3
        x-checker-data:
          type: anitya
          project-id: 5350
          stable-only: true
          url-template: https://cdn.kernel.org/pub/software/scm/git/git-$version.tar.xz

  - name: keycord
    buildsystem: simple

    build-options:
      prepend-path: /app/bin:/usr/lib/sdk/llvm22/bin
      prepend-ld-library-path: /app/lib:/usr/lib/sdk/llvm22/lib
      env:
        AWS_LC_SYS_CMAKE_BUILDER: '1'
        CLANG_PATH: /usr/lib/sdk/llvm22/bin/clang
        CARGO_HOME: /run/build/keycord/cargo
        LIBCLANG_PATH: /usr/lib/sdk/llvm22/lib
        BINDGEN_EXTRA_CLANG_ARGS: -resource-dir=/usr/lib/sdk/llvm22/lib/clang/22

    build-commands:
      - sed -i '/\[target.\x27cfg(target_os = "windows")\x27.*ependencies\]/,/^$/d'
        Cargo.toml
      - cargo --offline build --release --features flatpak
      - install -Dm0755 target/release/keycord /app/bin/keycord
      - install -Dm0644 data/scalable/apps/${FLATPAK_ID}.svg /app/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
      - install -Dm0644 data/keycord-search-provider.ini /app/share/gnome-shell/search-providers/${FLATPAK_ID}.search-provider.ini
      - install -Dm0644 data/keycord-search-provider.service /app/share/dbus-1/services/${FLATPAK_ID}.SearchProvider.service
      - install -Dm0644 data/${FLATPAK_ID}.gschema.xml /app/share/glib-2.0/schemas/${FLATPAK_ID}.gschema.xml
      - glib-compile-schemas /app/share/glib-2.0/schemas
      - mkdir mo
      - |
        for f in po/*.po; do
          lang=$(basename "$f" .po)
          mkdir -p "/app/share/locale/$lang/LC_MESSAGES"
          msgfmt "$f" -o "/app/share/locale/$lang/LC_MESSAGES/keycord.mo"
          msgfmt "$f" -o "mo/$lang.mo"
        done
      - itstool -j data/metainfo.xml -o data/${FLATPAK_ID}.metainfo.xml mo/*.mo
      - install -Dm0644 data/${FLATPAK_ID}.metainfo.xml /app/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - install -Dm0644 data/keycord.desktop /app/share/applications/${FLATPAK_ID}.desktop

    sources:
      - type: git
        url: https://github.com/noobping/keycord.git
        commit: ba67fb2cf2846b8e5a0ab6bf1b5e5aed3983fabd
      - cargo-sources.yml
